<a [routerLink]="['/products', product.slug]" class="product-card">
  <div class="product-card__image-wrap">
    <img [src]="primaryImage" [alt]="product.name" class="product-card__image" loading="lazy" />
    @if (!inStock) {
      <span class="product-card__badge product-card__badge--out">{{ 'productCard.outOfStock' | translate }}</span>
    }
    <div class="product-card__overlay">
      <button
        mat-flat-button
        class="product-card__add-btn"
        [disabled]="!inStock"
        (click)="addToCart($event)"
        [attr.aria-label]="'productCard.addToCart' | translate">
        <mat-icon>shopping_bag</mat-icon>
        {{ 'productCard.addToCart' | translate }}
      </button>
    </div>
  </div>

  <div class="product-card__info">
    @if (product.category) {
      <span class="product-card__category">{{ product.category.name }}</span>
    }
    <h3 class="product-card__name">{{ product.name }}</h3>
    <p class="product-card__price">{{ formattedPrice }}</p>
  </div>
</a>
